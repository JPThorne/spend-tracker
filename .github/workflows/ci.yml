name: CI

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore api/SpendTracker.slnx

      - name: Build
        run: dotnet build api/SpendTracker.slnx --no-restore -c Release

      - name: Test
        run: dotnet test api/SpendTracker.slnx --no-build -c Release
