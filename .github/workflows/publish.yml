name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Publish
        run: |
          dotnet publish api/src/SpendTracker.Api/SpendTracker.Api.csproj `
            -c Release `
            -r win-x64 `
            --self-contained `
            -p:PublishSingleFile=true `
            -p:PublishReadyToRun=true `
            -p:Version=${{ steps.version.outputs.version }} `
            -o publish/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: SpendTracker ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: publish/SpendTracker.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update update manifest
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          cat > docs/update.xml << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <item>
            <version>${VERSION}.0</version>
            <url>https://github.com/JPThorne/spend-tracker/releases/download/${TAG}/SpendTracker.exe</url>
            <changelog>https://github.com/JPThorne/spend-tracker/releases</changelog>
            <mandatory>false</mandatory>
          </item>
          EOF

      - name: Commit and push manifest
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/update.xml
          git commit -m "chore: update manifest to ${{ steps.version.outputs.version }} [skip ci]"
          git push origin main
