<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendTracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>💰 Spend Tracker</h1>
            <div class="view-tabs" id="viewTabs">
                <button id="tabCategorize" class="tab-btn active" onclick="showCategorizeView()">
                    📋 Categorise Transactions
                </button>
                <button id="tabCategories" class="tab-btn" onclick="showCategoryView()">
                    📊 View Categories
                </button>
            </div>
        </header>

        <main class="main-content" id="mainContent" style="display: none;">

            <!-- ── Categorise View ───────────────────────────────────────── -->
            <div id="categorizeView">

                <!-- CSV Upload -->
                <section class="upload-section">
                    <div class="section-header">
                        <h2>Upload Transactions</h2>
                    </div>
                    <div class="upload-form">
                        <select id="bankType" class="input" required>
                            <option value="">-- Select Bank --</option>
                            <option value="investec">Investec</option>
                            <option value="absa">Absa</option>
                            <option value="nedbank">Nedbank</option>
                        </select>
                        <input type="file" id="csvFile" accept=".csv" class="input">
                        <button id="uploadBtn" class="btn btn-primary">Upload CSV</button>
                    </div>
                </section>

                <!-- Uncategorised Transactions -->
                <section class="transaction-section">
                    <div class="section-header">
                        <h2>Uncategorised Transactions</h2>
                        <div class="bulk-actions">
                            <button id="categorizeSelectedBtn" class="btn btn-secondary" disabled>
                                Assign Category &nbsp;<span class="selected-badge" id="selectedCount">0</span>
                            </button>
                        </div>
                    </div>

                    <div class="transaction-search-bar">
                        <input type="search" id="transactionSearch" class="input search-input"
                               placeholder="Filter by description…"
                               oninput="onTransactionSearch()">
                    </div>

                    <div class="table-container">
                        <table class="transaction-table">
                            <thead>
                                <tr>
                                    <th class="col-check"><input type="checkbox" id="selectAll"></th>
                                    <th class="col-date">Date</th>
                                    <th class="col-desc">Description</th>
                                    <th class="col-amount">Amount</th>
                                    <th class="col-actions">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="transactionTableBody"></tbody>
                        </table>
                    </div>
                </section>

            </div>
            <!-- ── End Categorise View ───────────────────────────────────── -->

            <!-- ── View Categories ──────────────────────────────────────── -->
            <div id="categoryDetailView" style="display: none;">

                <!-- Category Management -->
                <section class="category-section">
                    <div class="section-header">
                        <h2>Manage Categories</h2>
                        <button id="addCategoryBtn" class="btn btn-secondary">+ Add Category</button>
                    </div>
                    <div class="category-list" id="categoryList"></div>
                </section>

                <!-- Spending Analytics -->
                <section class="category-detail-section">
                    <div class="section-header">
                        <h2>Spending by Category</h2>
                        <p class="section-subtitle">Sorted by spending (highest first)</p>
                    </div>

                    <div class="date-filter-panel">
                        <div class="date-filter-controls">
                            <label for="datePreset">Date Range:</label>
                            <select id="datePreset" class="input" onchange="onDatePresetChange()">
                                <option value="this-month">This Month</option>
                                <option value="last-month">Last Month</option>
                                <option value="last-3-months">Last 3 Months</option>
                                <option value="this-quarter">This Quarter</option>
                                <option value="last-quarter">Last Quarter</option>
                                <option value="this-year">This Year</option>
                                <option value="last-year">Last Year</option>
                                <option value="all-time">All Time</option>
                                <option value="custom">Custom Range</option>
                            </select>
                            <div id="customDateInputs" class="custom-date-inputs" style="display: none;">
                                <input type="date" id="customStartDate" class="input">
                                <span>to</span>
                                <input type="date" id="customEndDate" class="input">
                                <button class="btn btn-primary btn-sm" onclick="applyCustomDateRange()">Apply</button>
                            </div>
                        </div>
                        <div id="dateRangeDisplay" class="date-range-display"></div>
                    </div>

                    <div id="categoryDetailContainer"></div>
                </section>

            </div>
            <!-- ── End View Categories ───────────────────────────────────── -->

        </main>

        <footer class="app-footer">
            <span id="appVersion">SpendTracker</span>
        </footer>

        <div class="loading" id="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Loading…</p>
        </div>
    </div>

    <!-- Add / Edit Category Modal -->
    <div class="modal" id="categoryModal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add Category</h2>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <form id="categoryForm">
                <div class="form-group">
                    <label for="categoryName">Category Name</label>
                    <input type="text" id="categoryName" class="input" required placeholder="e.g., Groceries">
                </div>
                <div class="form-group">
                    <label for="categoryDescription">Description (optional)</label>
                    <textarea id="categoryDescription" class="input" placeholder="e.g., Supermarket and food shopping"></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveCategoryBtn">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Category Picker Modal -->
    <div class="modal" id="categoryPickerModal" style="display: none;">
        <div class="modal-content category-picker-content">
            <div class="modal-header">
                <h2 id="pickerModalTitle">Assign Category</h2>
                <button class="modal-close" id="pickerModalClose">&times;</button>
            </div>
            <div class="category-picker-search">
                <input type="search" id="categoryPickerSearch" class="input search-input"
                       placeholder="Search categories…"
                       oninput="onCategoryPickerSearch()">
            </div>
            <div class="category-picker-grid" id="categoryPickerGrid"></div>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" id="pickerCancelBtn">Cancel</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
