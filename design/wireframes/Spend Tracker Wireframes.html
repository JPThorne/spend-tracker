<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Spend Tracker — Wireframes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&family=Architects+Daughter&family=Special+Elite&family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap">
  <style>
    :root {
      --paper: #f5f1ea;
      --paper-soft: #ece6db;
      --ink: #1c1a17;
      --ink-soft: #6e655a;
      --accent: #1c1a17;
      --accent-soft: #e4dccc;
      --font-hand: 'Patrick Hand', 'Architects Daughter', system-ui, sans-serif;
      --font-marker: 'Caveat', 'Architects Daughter', cursive;
      --font-print: 'Inter', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
    }
    html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font-family: var(--font-hand); }
    body.dark {
      --paper: #1e1c19;
      --paper-soft: #2a2723;
      --ink: #f0ebe1;
      --ink-soft: #9b9286;
      --accent: #d6c6a8;
      --accent-soft: #38322a;
    }
    body.clean {
      --font-hand: 'Inter', system-ui, sans-serif;
      --font-marker: 'Inter', system-ui, sans-serif;
    }
    /* keep sketch SVGs invisible when toggled off */
    body.clean svg path[stroke-linejoin="round"][stroke-linecap="round"] { filter: none; }
    #app { min-height: 100vh; }
    /* Soften the design canvas grid bg */
    .annotation { user-select: none; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="shared.jsx"></script>
  <script type="text/babel" src="direction-c.jsx"></script>

  <script type="text/babel">
    const { useEffect } = React;

    const DEFAULTS = /*EDITMODE-BEGIN*/{
      "dark": false,
      "clean": true,
      "showAnnotations": true,
      "accent": "ink"
    }/*EDITMODE-END*/;

    const ACCENT_PRESETS = {
      ink:    { accent: '#1c1a17',  accentSoft: '#e4dccc' },
      orange: { accent: '#c25a2c',  accentSoft: '#f3dac4' },
      forest: { accent: '#2c5a3a',  accentSoft: '#d3e3d6' },
      ink_dk: { accent: '#d6c6a8',  accentSoft: '#38322a' },
    };

    function applyBody(t) {
      document.body.classList.toggle('dark', !!t.dark);
      document.body.classList.toggle('clean', !!t.clean);
      document.body.classList.toggle('no-annotations', !t.showAnnotations);
      const p = ACCENT_PRESETS[t.accent] || ACCENT_PRESETS.ink;
      const dp = t.dark ? ACCENT_PRESETS.ink_dk : p;
      if (t.accent === 'ink' && t.dark) {
        document.documentElement.style.setProperty('--accent', dp.accent);
        document.documentElement.style.setProperty('--accent-soft', dp.accentSoft);
      } else {
        document.documentElement.style.setProperty('--accent', p.accent);
        document.documentElement.style.setProperty('--accent-soft', t.dark ? '#38322a' : p.accentSoft);
      }
    }

    // hide annotations style hook
    const style = document.createElement('style');
    style.textContent = `
      body.no-annotations .annotation { display: none !important; }
    `;
    document.head.appendChild(style);

    function App() {
      const [t, setTweak] = useTweaks(DEFAULTS);

      useEffect(() => { applyBody(t); }, [t]);

      return (
        <>
          <DesignCanvas>
            <DCSection id="c" title="Spend-first" subtitle="Home page = Spend dashboard. Categorize is a route with a pending badge. Categories live in a drawer that opens from any page.">
              <DCArtboard id="c-spend" label="Spend (home)" width={1100} height={680}><C_Spend /></DCArtboard>
              <DCArtboard id="c-cat" label="Categorize (focused row)" width={1100} height={680}><C_Categorize /></DCArtboard>
              <DCArtboard id="c-drawer" label="Categories drawer" width={1100} height={680}><C_CategoriesDrawer /></DCArtboard>
            </DCSection>
          </DesignCanvas>

          <TweaksPanel title="Tweaks">
            <TweakSection label="Vibe">
              <TweakToggle label="Dark mode" value={t.dark} onChange={v => setTweak('dark', v)} />
              <TweakToggle label="Clean lines (kill the sketch)" value={t.clean} onChange={v => setTweak('clean', v)} />
              <TweakToggle label="Show annotations" value={t.showAnnotations} onChange={v => setTweak('showAnnotations', v)} />
            </TweakSection>
            <TweakSection label="Accent">
              <TweakRadio
                value={t.accent}
                onChange={v => setTweak('accent', v)}
                options={[
                  { value: 'ink', label: 'B&W' },
                  { value: 'orange', label: 'Warm' },
                  { value: 'forest', label: 'Forest' },
                ]}
              />
            </TweakSection>
          </TweaksPanel>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('app')).render(<App />);
  </script>
</body>
</html>
